# skills-collection 单一事实源 (Single Source of Truth) v1.1
# sync.ps1 / update.ps1 / lint.ps1 均从此文件读取。修改部署/启用状态请只改此文件。
#
# v1.1 变更（全局版本管理设计）:
#   - updatePolicy: 更新检测策略（TTL 内缓存命中 → 零网络）
#   - 每个 vertical 条目: pin(本地内容对应 upstream commit) + acquiredAt(采集日期)
#     + checkCache(lastCheckedAt/lastRemoteHead, 由 update.ps1 维护)
#   - vendored 仓库保留 .git（blob:none 过滤元数据）, update.ps1 用 git fetch 增量检测,
#     无需每次全量计算
#
# 字段说明:
#   targets     : 目标客户端部署根目录（key = 客户端名, value = 目录绝对路径）
#   updatePolicy: { ttlDays: 缓存有效期(天), fetchMode: 元数据拉取模式 }
#   base        : 基座（submodule 跟踪 upstream, 按模块部署）; pin = tag
#   vertical    : 垂直参考（vendored, 保留 .git）; pin = upstream commit(短 hash)
#     domain    : js=Web/JS逆向 bin=二进制 apk=Android ios=iOS kb=知识库 ctf=CTF mw=恶意软件 misc=其他
#     deploy    : 部署映射 { 客户端: bool }（空 = 仅参考不部署）

schemaVersion: "1.1"
description: "skills-collection 单一事实源：源 → 本地路径 → 版本记录 → 部署目标"

updatePolicy:
  ttlDays: 7            # checkCache 有效天数; 有效期内 update.ps1 不发起网络请求
  fetchMode: blob:none  # vendored .git 元数据模式（commit/tree, 不含 blob）

targets:
  claude: C:\Users\Lenovo\.cc-switch\skills
  # codex: C:\Users\Lenovo\.codex\skills    # 需要时启用并安装对应客户端

